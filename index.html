<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3347ff">
<meta name="description" content="Tessera: la card fedeltà digitale per attività locali. I clienti la tengono sul telefono, tu aggiungi i tasselli con una scansione. Senza tessere di carta.">
<meta property="og:title" content="Tessera · La card fedeltà per la tua attività">
<meta property="og:description" content="Fai tornare i tuoi clienti. Senza tessere di carta.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light}body{margin:0}.pill{padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}.pill.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.wide{grid-column:1/-1;flex-wrap:wrap}
</style>
<title>Tessera · Card fedeltà per la tua attività</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f6f7fb;--surface:#ffffff;--fg:#10131f;--muted:#586079;--line:#dfe2ee;--soft:#eceeff;
  --brand:#3347ff;--brand-fg:#ffffff;--coral:#ff6b4a;--glow:#3347ff;--ok:#15803d;--bad:#b42318;
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0a0c15;--surface:#141827;--fg:#eef0fa;--muted:#9aa1ba;--line:#242a40;--soft:#1a2040;--brand:#6c7bff;--brand-fg:#0a0c15;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0a0c15;--surface:#141827;--fg:#eef0fa;--muted:#9aa1ba;--line:#242a40;--soft:#1a2040;--brand:#6c7bff;--brand-fg:#0a0c15;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.glow i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.22;background:var(--glow);transition:background .6s}
.glow i:nth-child(1){width:60vmax;height:60vmax;right:-22vmax;top:-26vmax}
.glow i:nth-child(2){width:44vmax;height:44vmax;left:-20vmax;top:46vh;background:var(--coral);opacity:.12}

/* testata */
.top{position:sticky;top:0;z-index:30;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.03em;text-decoration:none;color:inherit}
.logo svg{width:30px;height:30px}

/* pulsanti e campi */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:active{transform:scale(.97)}
@media (hover:hover){.btn:hover{transform:translateY(-1px)}}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-fg);box-shadow:0 14px 28px -14px var(--brand)}
.btn.sm{min-height:40px;padding:8px 16px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.field>.l{font-size:13px;font-weight:600}
.field .opt{font-weight:400;color:var(--muted)}
.field input[type=text],.field input[type=email],.field input[type=tel],.field select{width:100%;min-height:48px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.field input:focus,.field select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.hint{font-size:12px;color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center;padding-block:36px 28px}
.hero>*{min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;margin-bottom:18px}
.eyebrow i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--brand)}
.eyebrow svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1.big{font-size:clamp(36px,6.6vw,54px);font-weight:800;letter-spacing:-.04em;line-height:.98}
h1.big em{font-style:normal;color:var(--brand);background:linear-gradient(var(--coral),var(--coral)) 0 96%/100% .11em no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding-bottom:.06em;animation:ul .9s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes ul{from{background-size:0 .11em}to{background-size:100% .11em}}
.lead{font-size:clamp(17px,2.4vw,20px);color:var(--muted);margin:20px 0 26px;max-width:34em}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.ticks{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.ticks li{display:flex;align-items:center;gap:7px}
.ticks svg{width:16px;height:16px;fill:none;stroke:var(--ok);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.stage{position:relative;padding:24px 0 80px}
.stage .float{animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-8px) rotate(.6deg)}}
.chipq{position:absolute;right:14px;bottom:0;z-index:3;width:86px;padding:7px;border-radius:16px;background:#fff;box-shadow:0 18px 36px -14px rgba(10,14,40,.5),0 0 0 1px rgba(16,19,31,.08);animation:bob 5s ease-in-out -2s infinite}
.chipq svg{display:block;width:100%;height:auto}
.chipq::after{content:"";position:absolute;left:8px;right:8px;height:2px;border-radius:2px;background:var(--brand);box-shadow:0 0 10px var(--brand);animation:sc 2s ease-in-out infinite}
@keyframes sc{0%,100%{top:12px}50%{top:calc(100% - 14px)}}
.chipp{position:absolute;right:16px;top:6px;z-index:3;padding:8px 14px;border-radius:99px;background:#16a34a;color:#fff;font-weight:800;font-size:15px;box-shadow:0 14px 28px -10px rgba(22,163,74,.7);animation:pop 3.6s ease-in-out infinite}
@keyframes pop{0%,12%{transform:scale(0) rotate(-12deg);opacity:0}22%{transform:scale(1.12) rotate(4deg);opacity:1}30%,78%{transform:scale(1) rotate(0);opacity:1}92%,100%{transform:translateY(-14px);opacity:0}}
.strip{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;margin-top:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.strip-l{font-size:13px;font-weight:600;color:var(--muted);margin-top:10px}
.tchip{flex:none;scroll-snap-align:center;display:flex;align-items:center;gap:8px;padding:9px 15px 9px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .2s,color .2s,transform .15s}
.tchip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tchip:active{transform:scale(.96)}
.tchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* sezioni */
section.s{padding-block:56px}
.kick{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:10px}
h2.t{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.035em;line-height:1.02;max-width:18em}
.sub{color:var(--muted);font-size:17px;margin-top:14px;max-width:36em}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.grid3>*{min-width:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px}
.box h3{font-size:19px;margin-bottom:8px}
.box p{color:var(--muted);font-size:15px}
.box .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--brand);margin-bottom:16px}
.box .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px;counter-reset:st}
.steps>*{min-width:0}
.step{counter-increment:st;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px}
.step::before{content:counter(st);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-fg);font-weight:800;font-family:var(--font-display)}
.step h3{font-size:20px}
.step p{color:var(--muted);font-size:15px}
.vis{margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:center;min-height:130px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.vis .qrm{width:104px;padding:7px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px rgba(16,19,31,.1)}
.vis .qrm svg{display:block;width:100%;height:auto}
.vis .sw{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:14px}
.vis .sw b{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.vis .scanmock{position:relative;width:112px;height:112px;border-radius:16px;background:linear-gradient(150deg,#1b2036,#0b0e1c)}
.vis .scanmock::before{content:"";position:absolute;inset:18px;background:
  linear-gradient(var(--brand),var(--brand)) top left/22px 3px no-repeat,linear-gradient(var(--brand),var(--brand)) top left/3px 22px no-repeat,
  linear-gradient(var(--brand),var(--brand)) top right/22px 3px no-repeat,linear-gradient(var(--brand),var(--brand)) top right/3px 22px no-repeat,
  linear-gradient(var(--brand),var(--brand)) bottom left/22px 3px no-repeat,linear-gradient(var(--brand),var(--brand)) bottom left/3px 22px no-repeat,
  linear-gradient(var(--brand),var(--brand)) bottom right/22px 3px no-repeat,linear-gradient(var(--brand),var(--brand)) bottom right/3px 22px no-repeat}
.vis .scanmock i{position:absolute;left:26px;right:26px;height:2px;background:var(--brand);box-shadow:0 0 10px var(--brand);animation:sc2 2.2s ease-in-out infinite}
@keyframes sc2{0%,100%{top:28px}50%{top:82px}}
.vis .plus{position:absolute;right:-10px;top:-8px;background:#16a34a;color:#fff;font-weight:800;border-radius:99px;padding:4px 11px;font-size:14px}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.feat>*{min-width:0}

/* crea la tua card */
.make{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px;align-items:start}
.make>*{min-width:0}
.formbox{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px}
.formbox h3{font-size:20px;margin-bottom:16px}
.preview{position:sticky;top:84px}
.preview .cap{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper output{min-width:48px;text-align:center;font-family:var(--font-display);font-weight:800;font-size:24px}
.stepper button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:600;cursor:pointer;touch-action:manipulation}
.stepper button:active{transform:scale(.94)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label{width:40px;height:40px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.swatches input:checked+label{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fg)}
.swatches input:focus-visible+label{outline:2px solid var(--brand);outline-offset:4px}
.sep{height:1px;background:var(--line);margin:20px 0}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:0 0 8px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:2px 0 14px}
.consent input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--brand)}
.done{display:none;text-align:center;padding:12px 4px}
.done.on{display:block}
.done .ok{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.done .ok svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done h3{margin-bottom:8px}
.done p{color:var(--muted);margin-bottom:16px}
.done pre{text-align:left;white-space:pre-wrap;font:13px/1.5 var(--font-body);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 16px}

/* faq */
.faq{margin-top:26px;display:grid;gap:10px;max-width:760px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 20px}
.faq summary{cursor:pointer;list-style:none;padding:18px 0;font-weight:600;display:flex;justify-content:space-between;gap:14px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;line-height:1;color:var(--brand);flex:none;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--muted);padding:0 0 18px}

.final{margin-block:20px 40px;padding:44px 26px;border-radius:32px;text-align:center;color:#fff;background:linear-gradient(150deg,#3b4dff,#1b22b5);position:relative;overflow:hidden}
.final::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 108% 108%,rgba(255,255,255,.07) 0 2px,transparent 2px 18px),radial-gradient(circle at 0 0,rgba(255,255,255,.2),transparent 50%)}
.final>*{position:relative}
.final h2{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.035em;margin:0 auto 12px;max-width:16em}
.final p{opacity:.85;margin:0 auto 24px;max-width:30em}
.final .btn{background:#fff;color:#1b22b5;border-color:#fff}
footer.f{padding:10px 0 calc(34px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--muted);text-align:center}

/* reveal */
.js .rv{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.js .rv.in{opacity:1;transform:none}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:22px;padding-block:22px 18px}
  .make{grid-template-columns:1fr}
  .preview{position:static;order:-1}
  .grid3,.steps,.feat{grid-template-columns:1fr}
  section.s{padding-block:40px}
  .stage{max-width:440px;margin:0 auto;width:100%}
  .chipq{width:74px}
}
@media (max-width:560px){
  .ctas .btn{width:100%}
  .final{padding:34px 18px;border-radius:26px}
  .top .btn{padding:8px 14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .rv{opacity:1;transform:none}
}

/* LA CARD */
.card{--c1:#3347ff;--c2:#1b22b5;--gift:#ff6b4a;position:relative;overflow:hidden;color:#fff;border-radius:24px;padding:20px 20px 18px;
  background:linear-gradient(150deg,var(--c1),var(--c2));
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 26px 50px -26px var(--c2),0 10px 22px -16px rgba(0,0,0,.5)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-radial-gradient(circle at 108% 108%,rgba(255,255,255,.075) 0 2px,transparent 2px 16px),radial-gradient(circle at 0% 0%,rgba(255,255,255,.18),transparent 45%)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.2) 50%,transparent 62%);background-size:260% 100%;background-position:150% 0;animation:sweep 7s ease-in-out 1.5s infinite}
@keyframes sweep{0%{background-position:150% 0}40%,100%{background-position:-60% 0}}
.card>*{position:relative}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s ease-out;will-change:transform}
.sheen{position:absolute!important;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.38),transparent 52%);opacity:0;transition:opacity .25s;mix-blend-mode:soft-light}
.hot .sheen{opacity:1}
.card header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.biz{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.025em;line-height:1.05;overflow-wrap:anywhere}
.chipno{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-top:6px;font-variant-numeric:tabular-nums}
.ring{width:42px;height:42px;flex:none}
.ring circle{fill:none;stroke:rgba(255,255,255,.85);stroke-width:1.6}
.ring .dash{stroke-dasharray:2.4 3.6;animation:spin 24s linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.slots{display:grid;gap:10px}
.slot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px dashed rgba(255,255,255,.38);color:rgba(255,255,255,.62);font-family:var(--font-display);font-weight:600;font-size:14px;position:relative}
.slot .st{display:none;width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}
.slot.on{border-color:transparent;transform:rotate(var(--rot,0deg));animation:thump .55s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d,0ms)}
.slot.on .st{display:block}
.slot.on .n{display:none}
@keyframes thump{0%{transform:scale(2.4) rotate(calc(var(--rot,0deg) + 28deg));opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(var(--rot,0deg));opacity:1}}
.st .d{fill:#fff}.st .r{fill:none;stroke:var(--c1);stroke-width:1.4;stroke-dasharray:2 3}.st .s{fill:var(--c1)}
.slot.gift{border:2px solid var(--gift);color:var(--gift)}
.slot.gift svg.g{width:50%;height:50%}
.slot.gift.on{background:var(--gift);color:var(--c2);border-color:var(--gift);animation:thump .55s cubic-bezier(.2,1.5,.4,1) both,glow 2.2s ease-in-out .7s infinite}
.slot.gift .st{display:none!important}
.still .slot.gift.on{animation:glow 2.2s ease-in-out infinite!important}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gift) 70%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.prize{margin-top:16px;font-size:13px;opacity:.9}
.prize b{font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:10px;opacity:.75;margin-right:6px}
.card footer{display:flex;justify-content:space-between;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22)}
.card footer small{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.card footer b{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.01em;overflow-wrap:anywhere}
.card footer .r{text-align:right;font-variant-numeric:tabular-nums;flex:none}

.static .slot.on{animation:none!important;transform:rotate(var(--rot,0deg))}
.static .slot.gift.on{animation:glow 2.2s ease-in-out infinite!important}
.card{--c1:#3347ff;--c2:#1b22b5;--gift:#ffd166}

.rig{position:relative;width:min(100%,360px);transform-style:preserve-3d;will-change:transform}

.cs{transform-style:preserve-3d;border-radius:24px;box-shadow:0 40px 60px -30px rgba(10,15,60,.55)}

.c1{top:-28px;right:-14px}
.c2{bottom:48px;left:-22px;--z:55px;animation-duration:6s;animation-direction:reverse}

var SC={stream:null,raf:0,det:null,busy:false,last:'',lastT:0,tickT:0,undo:null,cv:null};
function scRes(m,k,undo){var r=$('#scr'); if(!r) return; r.className='res '+(k||''); r.innerHTML='<span>'+esc(m)+'</span>'+(undo?'<button class="btn sm" type="button" data-a="scundo">Annulla</button>':'');}
function loadJsQR(){return new Promise(function(ok,ko){
  if(window.jsQR) return ok();
  var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload=function(){ok();}; s.onerror=function(){ko();}; document.head.appendChild(s);
});}
function openScan(){
  if($('#scn')||!A) return;
  var d=document.createElement('div'); d.id='scn'; d.className='scn'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','Scansiona QR cliente');
  d.innerHTML='<video id="scv" playsinline muted></video><div class="fr"></div>'+
    '<div class="top"><b>Scansiona QR</b><button class="btn sm" type="button" data-a="scclose">Chiudi</button></div>'+
    '<div class="bot"><div class="res" id="scr"><span>Inquadra il QR sulla card del cliente</span></div>'+
    '<form id="scf" autocomplete="off"><input id="scc" type="text" inputmode="text" autocapitalize="characters" placeholder="Oppure scrivi il codice" aria-label="Codice cliente"><button class="btn primary" type="submit">Aggiungi</button></form></div>';
  document.body.appendChild(d);
  $('#scf').addEventListener('submit',function(ev){ev.preventDefault(); var i=$('#scc'); var v=i.value; i.value=''; if(v.trim()) scanCode(v,true);});
  SC.last=''; SC.undo=null; startCam();
}
function closeScan(){
  cancelAnimationFrame(SC.raf);
  if(SC.stream){SC.stream.getTracks().forEach(function(t){t.stop();}); SC.stream=null;}
  var d=$('#scn'); if(d) d.remove();
}
async function startCam(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('nocam');
    var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(!$('#scn')){st.getTracks().forEach(function(t){t.stop();}); return;}
    SC.stream=st; var v=$('#scv'); v.srcObject=st; v.muted=true; await v.play();
    SC.det=null;
    if('BarcodeDetector' in window){try{SC.det=new BarcodeDetector({formats:['qr_code']});}catch(x){SC.det=null;}}
    if(!SC.det) await loadJsQR();
    if(!$('#scn')) return;
    tick();
  }catch(x){
    scRes(x&&x.name==='NotAllowedError'?'Camera non autorizzata: scrivi il codice qui sotto.':'Camera non disponibile: scrivi il codice qui sotto.','bad');
  }
}
function tick(){
  var v=$('#scv'); if(!v) return;
  SC.raf=requestAnimationFrame(tick);
  var now=Date.now(); if(SC.busy||v.readyState<2||now-SC.tickT<130) return;
  SC.tickT=now; SC.busy=true;
  (async function(){
    var txt='';
    try{
      if(SC.det){var r=await SC.det.detect(v); if(r&&r.length) txt=r[0].rawValue;}
      else if(window.jsQR&&v.videoWidth){
        var w=Math.min(520,v.videoWidth), h=Math.round(w*v.videoHeight/v.videoWidth);
        if(!SC.cv) SC.cv=document.createElement('canvas'); SC.cv.width=w; SC.cv.height=h;
        var cx=SC.cv.getContext('2d',{willReadFrequently:true}); cx.drawImage(v,0,0,w,h);
        var im=cx.getImageData(0,0,w,h), q=jsQR(im.data,w,h,{inversionAttempts:'dontInvert'}); if(q) txt=q.data;
      }
    }catch(x){}
    SC.busy=false; if(txt) scanCode(txt,false);
  })();
}
function findByCode(raw){
  var k=String(raw||'').trim().toLowerCase(); if(!k) return null;
  for(var i=0;i<A.clients.length;i++) if(String(A.clients[i].code||'').trim().toLowerCase()===k) return A.clients[i];
  return null;
}
async function scanCode(raw,manual){
  var k=String(raw).trim().toLowerCase(), now=Date.now();
  if(!manual&&k===SC.last&&now-SC.lastT<3500) return; /* stesso QR ancora davanti alla camera: non contare due volte */
  SC.last=k; SC.lastT=now;
  var c=findByCode(raw);
  if(!c){scRes('QR non riconosciuto per questa attività','bad'); try{if(navigator.vibrate) navigator.vibrate([60,40,60]);}catch(x){} return;}
  var n=A.biz.slots;
  if(c.pts>=n){scRes(c.name+': card già completa, consegna il premio','warn'); return;}
  var old=c.pts; c.pts=old+1; render(false);
  try{if(navigator.vibrate) navigator.vibrate(25);}catch(x){}
  var u=await SB.from('tessera_clients').update({pts:c.pts}).eq('id',c.id);
  if(u.error){c.pts=old; render(false); scRes('Errore: '+u.error.message,'bad'); return;}
  SC.undo=c.id;
  scRes(c.name+' · '+c.pts+'/'+n+(c.pts>=n?' · card completa!':''),'ok',true);
}
async function undoScan(){
  var c=SC.undo&&cl(SC.undo); SC.undo=null; if(!c||c.pts<1) return;
  var old=c.pts; c.pts=old-1; render(false);
  var u=await SB.from('tessera_clients').update({pts:c.pts}).eq('id',c.id);
  if(u.error){c.pts=old; render(false); scRes('Errore: '+u.error.message,'bad'); return;}
  SC.last=''; scRes('Tassello annullato per '+c.name,'warn');
}

document.addEventListener('click',async function(e){

  if(a==='af'){S.f=t.getAttribute('data-k');render(false);return;}
  if(a==='logout'){closeScan();await SB.auth.signOut();A=null;ADM=null;S.res={};if(location.hash==='#venditore')location.hash='';go('home');return;}
  if(a==='acode'){var r=await SB.rpc('tessera_make_code',{p_owner:id});if(r.error)return toast('Errore: '+r.error.message);S.res[id]=r.data;render(false);return;}
  if(a==='aset'){var r2=await SB.rpc('tessera_admin_set',{p_owner:id,p_status:t.getAttribute('data-st'),p_days:parseInt(t.getAttribute('data-d')||'0',10)});if(r2.error)return toast('Errore: '+r2.error.message);await loadAdm();render(false);return;}
  if(!A) return;

  if(a==='scundo'){undoScan();return;}
  if(a==='share'||a==='copy'){
    var cc=cl(id); if(!cc) return; var lk=cardLink(cc);
    if(a==='share'){window.open(waLink(cc.phone,'Ciao '+cc.name+'! Ecco la tua card fedeltà di '+A.biz.name+': '+lk+'\nMostra il QR alla cassa per ricevere i tasselli.'),'_blank','noopener');return;}
    try{await navigator.clipboard.writeText(lk);toast('Link copiato');}catch(x){window.prompt('Copia il link della card:',lk);}
    return;
  }
  var c=cl(id); if(!c) return; var old=c.pts;
  if(a==='plus') c.pts=Math.min(A.biz.slots,c.pts+1);
  if(a==='minus') c.pts=Math.max(0,c.pts-1);
  if(a==='reset'){c.pts=0;toast('Card azzerata per '+c.name);}
  try{if(navigator.vibrate) navigator.vibrate(12);}catch(x){}
  render(false);
  var u=await SB.from('tessera_clients').update({pts:c.pts}).eq('id',id);
  if(u.error){c.pts=old;render(false);toast('Errore: '+u.error.message);}
});
document.addEventListener('submit',async function(e){
  var f=e.target.closest('form[data-f]'); if(!f) return; e.preventDefault();
  var k=f.getAttribute('data-f'), d=new FormData(f), g=function(n){return String(d.get(n)||'').trim();}, btn=f.querySelector('button[type=submit]');
  if(btn) btn.disabled=true;
  var done=function(m){if(m) fail(f,m); if(btn) btn.disabled=false;};
  if(k==='auth'){
    var em=g('email').toLowerCase(), pw=g('pw');
    if(!/^\S+@\S+\.\S+$/.test(em)) return done('Inserisci un’email valida.');
    if(S.mode==='reg'){
      if(g('biz').length<2) return done('Inserisci il nome dell’attività.');
      if(g('tel').replace(/\D/g,'').length<6) return done('Inserisci il numero WhatsApp.');
      if(pw.length<6) return done('La password deve avere almeno 6 caratteri.');
      var b=demoOf(S.trade);
      var r=await SB.auth.signUp({email:em,password:pw,options:{data:{trade:S.trade,biz_name:g('biz'),phone:g('tel'),reward:b.reward,slots:b.slots,theme:b.theme}}});
      if(r.error) return done(/registered/i.test(r.error.message)?'Questa email è già registrata: accedi.':'Registrazione non riuscita: '+r.error.message);
      if(!r.data.session){f.innerHTML='<p class="banner ok">Controlla la tua email e conferma l’indirizzo, poi accedi per iniziare i 3 giorni di prova.</p>';return;}
      await loadMe(); go('panel'); toast('Prova gratuita attiva: 3 giorni'); return;
    }
    var r1=await SB.auth.signInWithPassword({email:em,password:pw});
    if(r1.error) return done(/confirm/i.test(r1.error.message)?'Conferma prima l’email che ti abbiamo inviato.':'Email o password non corretti.');
    await loadMe(); if(!A) return done('Nessun profilo titolare per questa email.');
    go('panel'); return;
  }
  if(k==='alogin'){
    var em2=g('email').toLowerCase(), pw2=g('pw'), ar=S.mode==='areg';
    var r2=ar?await SB.auth.signUp({email:em2,password:pw2}):await SB.auth.signInWithPassword({email:em2,password:pw2});
    if(r2.error) return done(ar?'Non riuscito: '+r2.error.message:'Email o password non corretti.');
    if(ar&&!r2.data.session) return done('Account creato: conferma l’email, poi accedi.');
    await loadAdm(); if(!ADM) return done(ar?'Account creato. Ora va abilitato come super admin.':'Questo account non è abilitato come super admin.');
    render(true); return;
  }
  if(k==='code'){
    var rc=await SB.rpc('tessera_redeem',{p_code:g('code')});
    if(rc.data===true){await loadMe();render(true);toast('Profilo attivato');} else done('Codice non valido.'); return;
  }
  if(k==='cl'){
    if(g('name').length<2) return done('Inserisci il nome del cliente.');
    var ri=await SB.from('tessera_clients').insert({owner_id:A.id,name:g('name'),phone:g('phone')||null}).select().single();
    if(ri.error) return done('Non riuscito: '+ri.error.message);
    A.clients.unshift(ri.data); render(false); toast('Card creata'); return;
  }
  if(k==='set'){
    var n=parseInt(g('slots'),10); if(isNaN(n)) n=A.biz.slots; n=Math.max(3,Math.min(24,n));
    var th=g('theme'); if(!THEMES[th]) th=A.biz.theme;
    var rs=await SB.from('tessera_owners').update({biz_name:g('name')||A.biz.name,reward:g('reward')||A.biz.reward,slots:n,theme:th}).eq('id',A.id);
    if(rs.error) return done('Non riuscito: '+rs.error.message);
    await SB.from('tessera_clients').update({pts:n}).gt('pts',n);
    await loadMe(); render(false); toast('Salvato'); return;
  }
});
/* 3D: la card segue il dito/mouse, a riposo oscilla piano */
var tg={x:0,y:0},cu={x:0,y:0},hot=0;
document.addEventListener('pointermove',function(e){
  var s=$('#scene'); if(!s||REDUCED) return; var r=s.getBoundingClientRect();
  if(e.clientX<r.left-80||e.clientX>r.right+80||e.clientY<r.top-80||e.clientY>r.bottom+80) return;
  tg.y=((e.clientX-r.left)/r.width-.5)*44; tg.x=-((e.clientY-r.top)/r.height-.5)*34; hot=Date.now();
});
(function loop(t){
  var g=$('#rig'); if(g&&!REDUCED){
    if(Date.now()-hot>1500){tg.y=Math.sin(t/1800)*16;tg.x=Math.cos(t/2300)*6;}
    cu.x+=(tg.x-cu.x)*.08; cu.y+=(tg.y-cu.y)*.08;
    g.style.transform='rotateX('+cu.x.toFixed(2)+'deg) rotateY('+cu.y.toFixed(2)+'deg)';
  }
  requestAnimationFrame(loop);
})(0);
async function boot(){try{await Promise.all([loadMe(),loadAdm()]);}catch(e){} route(); if(S.view==='card') await loadCard(); render(true);}
function route(){
  var sc=secretFromHash();
  if(sc){S.secret=sc;S.view='card';return;}
  if(location.hash==='#venditore'){S.view='seller';return;}
  var h=hashTrade(); if(h) S.trade=h;
  if(!location.hash&&!A&&!ADM&&isStandalone()){var m=lsGet();if(m&&m.secret){S.secret=m.secret;S.view='card';return;}}
  if(S.view==='seller'||S.view==='card') S.view='home';
}
window.addEventListener('hashchange',async function(){route(); if(S.view==='card') await loadCard(); render(true);});
document.addEventListener('visibilitychange',async function(){if(!document.hidden&&S.view==='card'&&S.secret){await loadCard();render(false);}});
boot();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}

})();
