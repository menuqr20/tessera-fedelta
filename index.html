<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tessera Fedeltà</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Concetto: la card è un oggetto fisico (timbri a inchiostro, riflesso, inclinazione 3D) su fondo freddo con macchie di colore in movimento.
   Cobalto + corallo, un solo gesto grande: i timbri che si riempiono. */
:root{
  --bg:#eef0f6; --surface:#ffffff; --fg:#10131f; --muted:#596077; --line:#dcdfeb;
  --brand:#3347ff; --coral:#ff6b4a; --blob-a:.32; --blob-b:.24;
  --font-display:'Bricolage Grotesque',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0a0c15;--surface:#141827;--fg:#eef0fa;--muted:#9aa1ba;--line:#242a40;--brand:#6272ff;--blob-a:.22;--blob-b:.14;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0a0c15;--surface:#141827;--fg:#eef0fa;--muted:#9aa1ba;--line:#242a40;--brand:#6272ff;--blob-a:.22;--blob-b:.14;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;overflow-x:hidden;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:clamp(40px,8.2vw,76px);font-weight:800;letter-spacing:-.035em;line-height:.98}
h2{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto}

/* sfondo vivo */
.blobs{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.blobs i{position:absolute;width:52vmax;height:52vmax;border-radius:50%;filter:blur(80px)}
.blobs i:nth-child(1){background:var(--brand);opacity:var(--blob-a);top:-24vmax;right:-18vmax;animation:drift1 24s ease-in-out infinite alternate}
.blobs i:nth-child(2){background:var(--coral);opacity:var(--blob-b);bottom:-28vmax;left:-20vmax;animation:drift2 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-9vmax,12vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(12vmax,-9vmax) scale(.92)}}

/* testata */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.03em;border:0;background:none;cursor:pointer;padding:0}
.logo svg{width:30px;height:30px}
.logo .a{fill:var(--brand)} .logo .b{fill:none;stroke:#fff;stroke-width:1.6;stroke-dasharray:2.2 3} .logo .c{fill:#fff}
.seg{display:flex;background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--line);border-radius:12px;padding:3px;backdrop-filter:blur(8px)}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* pulsanti, campi */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 22px;cursor:pointer;font-weight:600;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 10px 24px -12px var(--brand)}
.btn.sm{padding:7px 13px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.field .l{font-size:13px;font-weight:600}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=number]{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.small{font-size:13px;color:var(--muted)}
.err{color:#dc2626;font-size:13px;min-height:18px;margin-bottom:8px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#f87171}}
:root[data-theme="dark"] .err{color:#f87171}
.link{border:0;background:none;color:var(--brand);text-decoration:underline;cursor:pointer;padding:0}

/* landing */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding-block:40px 56px}
.hero>*{min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--line);margin-bottom:22px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--coral);animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.w{display:inline-block;animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 90ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.mark{position:relative;color:var(--brand)}
.mark svg{position:absolute;left:-2%;bottom:-.12em;width:104%;height:.2em;overflow:visible}
.mark path{fill:none;stroke:var(--coral);stroke-width:5;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1s ease-out 1.1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lead{font-size:18px;color:var(--muted);margin-top:24px;max-width:44ch;animation:rise .8s cubic-bezier(.2,.8,.2,1) .7s both}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;animation:rise .8s cubic-bezier(.2,.8,.2,1) .85s both}
.stage{position:relative;display:grid;justify-items:center;padding:20px 10px 30px;animation:rise 1s cubic-bezier(.2,.8,.2,1) .3s both}
.stage .ghost{position:absolute;width:min(100%,440px);top:34px;bottom:44px;border-radius:26px;background:linear-gradient(150deg,#ff6b4a,#ffa07d);transform:rotate(-7deg) translate(-16px,8px);opacity:.9}
.float{width:100%;max-width:440px;position:relative;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:20px;padding-block:20px 40px}}

/* fascia scorrevole */
.band{overflow:hidden;border-block:1px solid var(--line);padding-block:14px;margin-bottom:56px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.band div{display:flex;gap:36px;width:max-content;animation:scroll 32s linear infinite;font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.band span{display:inline-flex;align-items:center;gap:36px}
.band span::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--coral)}
@keyframes scroll{to{transform:translateX(-50%)}}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:24px}
.step{background:color-mix(in srgb,var(--surface) 86%,transparent);border:1px solid var(--line);border-radius:20px;padding:22px;animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 120ms + 1.1s)}
.step .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-family:var(--font-display);font-weight:800;font-size:19px;margin-bottom:16px;transform:rotate(var(--r,0deg))}
.step p{color:var(--muted);margin-top:6px;font-size:14px}
@media (max-width:820px){.steps{grid-template-columns:1fr}}

/* LA CARD */
.card{--c1:#3347ff;--c2:#1b22b5;--gift:#ff6b4a;position:relative;overflow:hidden;color:#fff;border-radius:26px;padding:24px 24px 22px;
  background:linear-gradient(150deg,var(--c1),var(--c2));
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 30px 60px -28px var(--c2),0 12px 24px -16px rgba(0,0,0,.5)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-radial-gradient(circle at 108% 108%,rgba(255,255,255,.075) 0 2px,transparent 2px 16px),radial-gradient(circle at 0% 0%,rgba(255,255,255,.18),transparent 45%)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.2) 50%,transparent 62%);background-size:260% 100%;background-position:150% 0;animation:sweep 7s ease-in-out 1.5s infinite}
@keyframes sweep{0%{background-position:150% 0}40%,100%{background-position:-60% 0}}
.card>*{position:relative}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s ease-out;will-change:transform}
.sheen{position:absolute!important;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.38),transparent 52%);opacity:0;transition:opacity .25s;mix-blend-mode:soft-light}
.hot .sheen{opacity:1}
.card header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.biz{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.025em;line-height:1.05;overflow-wrap:anywhere}
.chipno{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-top:6px;font-variant-numeric:tabular-nums}
.ring{width:42px;height:42px;flex:none}
.ring circle{fill:none;stroke:rgba(255,255,255,.85);stroke-width:1.6}
.ring .dash{stroke-dasharray:2.4 3.6;animation:spin 24s linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.slots{display:grid;gap:12px}
.slot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px dashed rgba(255,255,255,.38);color:rgba(255,255,255,.62);font-family:var(--font-display);font-weight:600;font-size:15px;position:relative;transition:border-color .3s}
.slot .st{display:none;width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}
.slot.on{border-color:transparent;transform:rotate(var(--rot,0deg));animation:thump .55s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d,0ms)}
.slot.on .st{display:block}
.slot.on .n{display:none}
@keyframes thump{0%{transform:scale(2.4) rotate(calc(var(--rot,0deg) + 28deg));opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(var(--rot,0deg));opacity:1}}
.st .d{fill:#fff}.st .r{fill:none;stroke:var(--c1);stroke-width:1.4;stroke-dasharray:2 3}.st .s{fill:var(--c1)}
.slot.gift{border:2px solid var(--gift);color:var(--gift)}
.slot.gift svg.g{width:50%;height:50%}
.slot.gift.on{background:var(--gift);color:var(--c2);border-color:var(--gift);animation:thump .55s cubic-bezier(.2,1.5,.4,1) both,glow 2.2s ease-in-out .7s infinite}
.slot.gift .st{display:none!important}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gift) 70%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.prize{margin-top:20px;font-size:13px;opacity:.88}
.prize b{font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:11px;opacity:.75;margin-right:6px}
.card footer{display:flex;justify-content:space-between;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22)}
.card footer small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.card footer b{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.01em;overflow-wrap:anywhere}
.card footer .r{text-align:right;font-variant-numeric:tabular-nums;flex:none}

.pagehead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding-block:28px 24px}
.center{display:grid;justify-items:center;gap:18px;padding-bottom:24px}
.center>.card,.center .tilt{width:100%;max-width:440px}
.done{max-width:440px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,#16a34a 14%,var(--surface));border:1px solid color-mix(in srgb,#16a34a 35%,var(--line));font-size:14px}

/* accesso */
.panel{background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:22px;padding:28px;max-width:430px;margin:36px auto;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;backdrop-filter:blur(8px)}
.panel h2{margin-bottom:6px}
.panel .small{margin-bottom:20px}

/* gestore */
.admin{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;padding-block:12px;align-items:start}
.admin>*{min-width:0}
.box{background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:20px;padding:22px}
.box h2{margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.nm{font-weight:600;overflow-wrap:anywhere}
.em{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--coral));border-radius:99px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,#16a34a 16%,var(--surface));color:#15803d;font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:#4ade80}}
:root[data-theme="dark"] .pill{color:#4ade80}
.cnt{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label{width:38px;height:38px;border-radius:50%;cursor:pointer;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked+label{box-shadow:0 0 0 2px var(--fg)}
.swatches input:focus-visible+label{outline:2px solid var(--brand);outline-offset:3px}
@media (max-width:820px){.admin{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 20px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .mark path{stroke-dashoffset:0}
  .slot.on{transform:rotate(var(--rot,0deg))}
}
</style>
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<body>

<div class="blobs" aria-hidden="true"><i></i><i></i></div>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>

<script>
(function(){
var KEY='tessera-bozza-v2', mem=null, PIN='1234', adminOK=false, authMode='register', authErr='', timer=null;
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var THEMES={
  cobalto:{n:'Cobalto',c1:'#3347ff',c2:'#1b22b5',g:'#ff6b4a'},
  prugna:{n:'Prugna',c1:'#7a2a6b',c2:'#3d0f38',g:'#ffb454'},
  smeraldo:{n:'Smeraldo',c1:'#0c8a62',c2:'#064d3a',g:'#ffd166'},
  grafite:{n:'Grafite',c1:'#434c5a',c2:'#14181f',g:'#ff7a59'},
  corallo:{n:'Corallo',c1:'#ff5a3c',c2:'#c42b14',g:'#ffe3a0'}
};
function seed(){return {mode:'cliente',view:'landing',session:null,
  biz:{name:'La tua attività',reward:'Un omaggio a tua scelta',slots:10,theme:'cobalto',
    users:[{name:'Giulia Rossi',email:'giulia@esempio.it',pw:'demo',pts:6},{name:'Marco Bianchi',email:'marco@esempio.it',pw:'demo',pts:10},{name:'Elena Conti',email:'elena@esempio.it',pw:'demo',pts:3}]}};}
function load(){
  try{var s=localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){}
  if(mem) return JSON.parse(mem);
  return seed();
}
var S=load();
function save(){var s=JSON.stringify(S); mem=s; try{localStorage.setItem(KEY,s);}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function me(){for(var i=0;i<S.biz.users.length;i++) if(S.biz.users[i].email===S.session) return {u:S.biz.users[i],i:i}; return null;}
function toast(m){var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},2000);}

var STAR='M24 14.5L26.35 20.76L33.04 21.06L27.8 25.24L29.58 31.69L24 28L18.42 31.69L20.2 25.24L14.96 21.06L21.65 20.76Z';
var STAMP='<svg class="st" viewBox="0 0 48 48" aria-hidden="true"><circle class="d" cx="24" cy="24" r="22"/><circle class="r" cx="24" cy="24" r="17.5"/><path class="s" d="'+STAR+'"/></svg>';
var GIFT='<svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8a1 1 0 001 1h12a1 1 0 001-1v-8M7.5 8a2.5 2.5 0 010-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 010 5"/></svg>';
var RING='<svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22"/><circle class="dash" cx="24" cy="24" r="16"/><path d="'+STAR+'" fill="#fff" stroke="none"/></svg>';
var LOGO='<svg viewBox="0 0 48 48" aria-hidden="true"><circle class="a" cx="24" cy="24" r="23"/><circle class="b" cx="24" cy="24" r="17"/><path class="c" d="'+STAR+'"/></svg>';

function cols(n){return n%5===0?5:(n%4===0?4:5);}
function slotsHtml(n,pts,stagger){
  var h='<div class="slots" style="grid-template-columns:repeat('+cols(n)+',1fr)" role="img" aria-label="'+pts+' tasselli su '+n+'">';
  for(var i=1;i<=n;i++){
    var on=i<=pts, last=i===n, rot=((i*37)%13)-6;
    var st='--rot:'+(last?0:rot)+'deg;'+(stagger&&on?'--d:'+(i*70+150)+'ms;':'');
    h+='<div class="slot'+(on?' on':'')+(last?' gift':'')+'" style="'+st+'">'+(last?GIFT:'<span class="n">'+i+'</span>'+STAMP)+'</div>';
  }
  return h+'</div>';
}
function cardHtml(b,name,pts,no,o){
  o=o||{}; var t=THEMES[b.theme]||THEMES.cobalto;
  return '<article class="card tilt" '+(o.demo?'data-demo ':'')+'style="--c1:'+t.c1+';--c2:'+t.c2+';--gift:'+t.g+'">'+
    '<div class="sheen"></div>'+
    '<header><div><div class="biz">'+esc(b.name)+'</div><div class="chipno">Card fedeltà · N° '+pad(no).padStart(4,'0')+'</div></div>'+RING+'</header>'+
    slotsHtml(b.slots,pts,!o.demo)+
    '<p class="prize"><b>Premio</b>'+esc(b.reward)+'</p>'+
    '<footer><div><small>Titolare</small><b>'+esc(name)+'</b></div><div class="r"><small>Tasselli</small><b class="cnt-n">'+pad(pts)+' / '+pad(b.slots)+'</b></div></footer></article>';
}

function top(){
  return '<header class="top wrap"><button class="logo" data-act="home" aria-label="Vai alla home">'+LOGO+'tessera</button>'+
    '<div class="seg" role="group" aria-label="Vista">'+
    '<button data-act="mode" data-m="cliente" aria-pressed="'+(S.mode==='cliente')+'">Vista cliente</button>'+
    '<button data-act="mode" data-m="admin" aria-pressed="'+(S.mode==='admin')+'">Pannello gestore</button></div></header>';
}

function words(list){return list.map(function(w,i){return w.indexOf('<')===0?w.replace('<span','<span style="--i:'+i+'"'):'<span class="w" style="--i:'+i+'">'+w+'</span>';}).join(' ');}
function landing(b){
  var h1=words(['Ogni','visita','lascia','il','<span class="w mark">segno<svg viewBox="0 0 240 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 8C40 2 90 12 140 5S205 7 238 3"/></svg></span>.']);
  var items=['Nessuna app da installare','Niente carta da perdere','Un tassello a ogni visita','Il premio arriva quando la card è piena','Si apre dal telefono'];
  var band=items.map(function(t){return '<span>'+t+'</span>';}).join('');
  return '<section class="hero"><div><p class="eyebrow"><i></i>'+esc(b.name)+'</p><h1>'+h1+'</h1>'+
    '<p class="lead">Registrati, mostra la card e ottieni un tassello a ogni visita. Al decimo, il premio è tuo.</p>'+
    '<div class="cta"><button class="btn primary" data-act="auth" data-m="register">Crea la tua card</button>'+
    '<button class="btn" data-act="auth" data-m="login">Ho già un account</button></div></div>'+
    '<div class="stage"><div class="ghost"></div><div class="float">'+cardHtml(b,'Il tuo nome',REDUCED?6:3,42,{demo:true})+'</div></div></section>'+
    '<div class="band" aria-hidden="true"><div>'+band+band+'</div></div>'+
    '<section class="steps">'+
    '<div class="step" style="--i:0"><div class="num" style="--r:-6deg">1</div><h3>Registrati</h3><p>Nome, email e password. Bastano trenta secondi e la card è tua.</p></div>'+
    '<div class="step" style="--i:1"><div class="num" style="--r:5deg">2</div><h3>Presenta la card</h3><p>Il gestore aggiunge un tassello a ogni visita e lo vedi comparire subito.</p></div>'+
    '<div class="step" style="--i:2"><div class="num" style="--r:-3deg">3</div><h3>Ritira il premio</h3><p>Quando tutti i tasselli sono pieni, mostra la card e il premio è tuo.</p></div></section>';
}

function auth(b){
  var reg=authMode==='register';
  return '<div class="panel"><h2>'+(reg?'Crea la tua card':'Bentornato')+'</h2><p class="small">'+esc(b.name)+'</p>'+
    '<form data-form="auth" novalidate>'+
    (reg?'<div class="field"><label for="f-name">Nome e cognome</label><input id="f-name" name="name" type="text" autocomplete="name"></div>':'')+
    '<div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email"></div>'+
    '<div class="field"><label for="f-pw">Password</label><input id="f-pw" name="pw" type="password" autocomplete="'+(reg?'new-password':'current-password')+'"></div>'+
    '<p class="err" id="auth-err">'+esc(authErr)+'</p>'+
    '<button class="btn primary" type="submit" style="width:100%">'+(reg?'Registrati':'Entra')+'</button></form>'+
    '<p class="small" style="margin:16px 0 0">'+(reg?'Hai già un account? <button class="link" data-act="auth" data-m="login">Accedi</button>':'Prima volta? <button class="link" data-act="auth" data-m="register">Registrati</button>')+
    ' · <button class="link" data-act="home">Indietro</button></p>'+
    (reg?'':'<p class="small" style="margin:10px 0 0">Account di prova: '+esc(b.users[0].email)+' / demo</p>')+'</div>';
}

function cardView(b){
  var m=me(); if(!m){S.view='landing';return landing(b);}
  var u=m.u, full=u.pts>=b.slots;
  return '<div class="pagehead"><div><h2>Ciao '+esc(u.name.split(' ')[0])+'</h2><p class="small">Questa è la tua card fedeltà.</p></div>'+
    '<button class="btn sm" data-act="logout">Esci</button></div><div class="center">'+cardHtml(b,u.name,u.pts,m.i+1)+
    (full?'<p class="done"><b>Card completa.</b> Mostra questa schermata al gestore per ritirare il premio.</p>':
    '<p class="small">Mancano '+(b.slots-u.pts)+' tasselli al premio.</p>')+'</div>';
}

function admin(b){
  if(!adminOK){
    return '<div class="panel"><h2>Pannello gestore</h2><p class="small">'+esc(b.name)+' · accesso riservato al titolare.</p>'+
      '<form data-form="pin" novalidate><div class="field"><label for="f-pin">PIN</label><input id="f-pin" name="pin" type="password" inputmode="numeric" autocomplete="off"></div>'+
      '<p class="err" id="auth-err">'+esc(authErr)+'</p><button class="btn primary" type="submit" style="width:100%">Entra</button></form>'+
      '<p class="small" style="margin:14px 0 0">PIN di prova: '+PIN+'</p></div>';
  }
  var rows='';
  b.users.forEach(function(u){
    var full=u.pts>=b.slots, pct=Math.round(u.pts/b.slots*100);
    rows+='<div class="row"><div><div class="nm">'+esc(u.name)+'</div><div class="em">'+esc(u.email)+'</div></div>'+
      '<div class="acts">'+(full?'<span class="pill">Completa</span>':'')+'<span class="cnt">'+u.pts+' / '+b.slots+'</span>'+
      '<button class="btn sm" data-act="minus" data-e="'+esc(u.email)+'" aria-label="Togli un tassello a '+esc(u.name)+'"'+(u.pts<=0?' disabled':'')+'>−1</button>'+
      (full?'<button class="btn sm primary" data-act="reset" data-e="'+esc(u.email)+'">Premio ritirato</button>':
        '<button class="btn sm primary" data-act="plus" data-e="'+esc(u.email)+'" aria-label="Aggiungi un tassello a '+esc(u.name)+'">+1</button>')+'</div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  });
  var sw=Object.keys(THEMES).map(function(k,i){var t=THEMES[k];
    return '<input type="radio" name="theme" id="sw'+i+'" value="'+k+'"'+(k===b.theme?' checked':'')+'><label for="sw'+i+'" style="background:linear-gradient(150deg,'+t.c1+','+t.c2+')" title="'+t.n+'"></label>';}).join('');
  return '<div class="admin"><section class="box"><h2>Clienti ('+b.users.length+')</h2>'+(rows||'<p class="small">Nessun cliente registrato.</p>')+
    '<p class="small" style="margin-top:12px">Clienti di esempio. Nella versione reale compaiono qui appena si registrano.</p></section>'+
    '<section class="box"><h2>Personalizza</h2><form data-form="settings" novalidate>'+
    '<div class="field"><label for="s-name">Nome attività</label><input id="s-name" name="name" type="text" value="'+esc(b.name)+'"></div>'+
    '<div class="field"><label for="s-rew">Premio</label><input id="s-rew" name="reward" type="text" value="'+esc(b.reward)+'"></div>'+
    '<div class="field"><label for="s-slots">Tasselli da riempire (3–24)</label><input id="s-slots" name="slots" type="number" min="3" max="24" value="'+b.slots+'"></div>'+
    '<div class="field"><span class="l">Stile della card</span><div class="swatches">'+sw+'</div></div>'+
    '<button class="btn primary" type="submit" style="width:100%">Salva modifiche</button></form></section></div>';
}

function stopDemo(){if(timer){clearInterval(timer);timer=null;}}
function startDemo(){
  stopDemo(); if(REDUCED) return;
  var card=document.querySelector('[data-demo]'); if(!card) return;
  var sl=card.querySelectorAll('.slot'), n=sl.length, c=card.querySelector('.cnt-n'), k=3;
  timer=setInterval(function(){
    k++; if(k>n+2) k=1;
    var v=Math.min(k,n);
    for(var i=0;i<n;i++) sl[i].classList.toggle('on',i<v);
    c.textContent=pad(v)+' / '+pad(n);
  },900);
}

function render(){
  stopDemo();
  var b=S.biz, main;
  if(S.mode==='admin') main=admin(b);
  else if(S.view==='register'||S.view==='login') main=auth(b);
  else if(S.view==='card') main=cardView(b);
  else main=landing(b);
  document.getElementById('app').innerHTML=top()+'<main class="wrap">'+main+'</main>';
  if(S.mode!=='admin'&&S.view==='landing') startDemo();
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var a=t.getAttribute('data-act'), b=S.biz;
  if(a==='mode'){S.mode=t.getAttribute('data-m');authErr='';}
  else if(a==='auth'){S.mode='cliente';authMode=t.getAttribute('data-m');S.view=authMode;authErr='';}
  else if(a==='home'){S.mode='cliente';S.view='landing';}
  else if(a==='logout'){S.session=null;S.view='landing';}
  else {
    var em=t.getAttribute('data-e'), u=null;
    b.users.forEach(function(x){if(x.email===em)u=x;});
    if(!u) return;
    if(a==='plus') u.pts=Math.min(b.slots,u.pts+1);
    if(a==='minus') u.pts=Math.max(0,u.pts-1);
    if(a==='reset'){u.pts=0;toast('Card azzerata per '+u.name);}
  }
  save(); render();
});

document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  var kind=f.getAttribute('data-form'), b=S.biz, d=new FormData(f);
  if(kind==='pin'){
    if(String(d.get('pin')).trim()===PIN){adminOK=true;authErr='';} else authErr='PIN non corretto.';
    render(); return;
  }
  if(kind==='auth'){
    var email=String(d.get('email')||'').trim().toLowerCase(), pw=String(d.get('pw')||''), name=String(d.get('name')||'').trim();
    var found=null; b.users.forEach(function(x){if(x.email===email)found=x;});
    if(!/^\S+@\S+\.\S+$/.test(email)){authErr='Inserisci un indirizzo email valido.';render();return;}
    if(authMode==='register'){
      if(name.length<2){authErr='Inserisci nome e cognome.';render();return;}
      if(pw.length<4){authErr='La password deve avere almeno 4 caratteri.';render();return;}
      if(found){authErr='Questa email è già registrata. Prova ad accedere.';render();return;}
      b.users.push({name:name,email:email,pw:pw,pts:0});
      S.session=email;S.view='card';authErr='';save();render();toast('Registrazione completata');return;
    }
    if(!found||found.pw!==pw){authErr='Email o password non corretti.';render();return;}
    S.session=email;S.view='card';authErr='';save();render();return;
  }
  if(kind==='settings'){
    var n=parseInt(d.get('slots'),10); if(isNaN(n)) n=b.slots; n=Math.max(3,Math.min(24,n));
    b.name=String(d.get('name')||'').trim()||b.name;
    b.reward=String(d.get('reward')||'').trim()||b.reward;
    var th=String(d.get('theme')||''); if(THEMES[th]) b.theme=th;
    b.slots=n; b.users.forEach(function(u){u.pts=Math.min(u.pts,n);});
    save();render();toast('Modifiche salvate');
  }
});

/* inclinazione 3D e riflesso che seguono il puntatore */
document.addEventListener('pointermove',function(e){
  if(REDUCED) return;
  var t=e.target.closest&&e.target.closest('.tilt'); if(!t) return;
  var r=t.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  t.style.setProperty('--ry',((x-.5)*16).toFixed(2)+'deg');
  t.style.setProperty('--rx',((.5-y)*16).toFixed(2)+'deg');
  t.style.setProperty('--mx',(x*100).toFixed(1)+'%');
  t.style.setProperty('--my',(y*100).toFixed(1)+'%');
  t.classList.add('hot');
});
document.addEventListener('pointerout',function(e){
  var t=e.target.closest&&e.target.closest('.tilt');
  if(t&&!t.contains(e.relatedTarget)){t.style.setProperty('--rx','0deg');t.style.setProperty('--ry','0deg');t.classList.remove('hot');}
});
render();
})();
</script>
</body>
</html>
